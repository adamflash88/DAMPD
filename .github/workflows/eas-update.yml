# Publishes an EAS Update you can open in Expo Go on your phone.
#   - Pull requests → EAS branch "pr-<number>" + a PR comment with a QR code.
#   - Pushes to main → EAS branch "main"; QR link in the run summary.
#
# One-time setup (see docs/IPHONE_TESTING.md):
#   1. Put your EAS project ID into app.json (replace REPLACE_WITH_EAS_PROJECT_ID, two places).
#   2. Add an Expo access token as the repository secret EXPO_TOKEN.
# Until both are done this workflow skips with a warning instead of failing.
name: EAS Update

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: eas-update-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # allow the QR-code comment on PRs

jobs:
  update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check one-time setup
        id: setup
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          ready=true
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning title=EXPO_TOKEN missing::Add an Expo access token as the repository secret EXPO_TOKEN (Settings → Secrets and variables → Actions). See docs/IPHONE_TESTING.md."
            ready=false
          fi
          if grep -q "REPLACE_WITH_EAS_PROJECT_ID" app.json; then
            echo "::warning title=EAS project ID missing::Replace REPLACE_WITH_EAS_PROJECT_ID in app.json with your project ID from expo.dev. See docs/IPHONE_TESTING.md."
            ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != "true" ]; then
            echo "### EAS Update skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "One-time setup is incomplete. Follow docs/IPHONE_TESTING.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Node
        if: steps.setup.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        if: steps.setup.outputs.ready == 'true'
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.setup.outputs.ready == 'true'
        run: npm ci

      - name: Publish PR preview
        id: pr
        if: steps.setup.outputs.ready == 'true' && github.event_name == 'pull_request'
        uses: expo/expo-github-action/preview@v9
        with:
          # Explicit branch: on pull_request events the checkout is a temporary merge ref.
          command: eas update --auto --branch pr-${{ github.event.pull_request.number }}
          qr-target: expo-go

      - name: Publish main
        id: main
        if: steps.setup.outputs.ready == 'true' && github.event_name != 'pull_request'
        uses: expo/expo-github-action/preview@v9
        with:
          command: eas update --auto --branch main
          qr-target: expo-go
          comment: false

      - name: Write run summary
        if: steps.setup.outputs.ready == 'true'
        env:
          QR: ${{ steps.pr.outputs.qr || steps.main.outputs.qr }}
          LINK: ${{ steps.pr.outputs.link || steps.main.outputs.link }}
          BRANCH: ${{ steps.pr.outputs.branchName || steps.main.outputs.branchName }}
          RUNTIME: ${{ steps.pr.outputs.runtimeVersion || steps.main.outputs.runtimeVersion }}
        run: |
          {
            echo "### EAS Update published"
            echo ""
            echo "- EAS branch: \`$BRANCH\`"
            echo "- Runtime version: \`$RUNTIME\`"
            echo "- Update page on expo.dev: $LINK"
            echo ""
            echo "Scan with the iPhone Camera app (opens in Expo Go):"
            echo ""
            echo "<a href=\"$QR\"><img src=\"$QR\" width=\"250\" height=\"250\" /></a>"
          } >> "$GITHUB_STEP_SUMMARY"
